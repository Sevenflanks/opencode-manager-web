name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to recover (for example v0.2.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: omw-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      check_id: ${{ steps.start-check.outputs.check_id }}
      pr_sha: ${{ steps.start-check.outputs.pr_sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Attach this
      # workflow's Windows validation directly to the generated PR head instead.
      - name: Start Release PR check
        id: start-check
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release/release-pr.mjs`).href
            const { resolveReleasePullRequest } = await import(moduleUrl)
            const pr = await resolveReleasePullRequest({
              rawPullRequest: process.env.RELEASE_PR,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              baseBranch: 'main',
              getPull: request => github.rest.pulls.get(request),
            })
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Release PR validation',
              head_sha: pr.sha,
              status: 'in_progress',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('check_id', String(data.id))
            core.setOutput('pr_sha', pr.sha)

  validate-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: windows-2025
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout immutable Release PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.pr_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure canonical temporary directory
        shell: pwsh
        env:
          RUNNER_TEMP_PATH: ${{ runner.temp }}
        run: |
          # isolation 守衛會拒絕 8.3 alias；不可直接沿用 Windows runner 的預設 TEMP。
          $canonicalTemp = node -p "require('node:fs').realpathSync.native(process.env.RUNNER_TEMP_PATH)"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canonicalTemp)) {
            throw "Failed to resolve runner.temp to a canonical path."
          }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV

      - run: npm ci
      - name: Verify synchronized release version
        shell: pwsh
        run: npm run release:verify -- "v$(node -p "require('./packages/launcher/package.json').version")"
      - run: npm test
      - run: npm run typecheck
      - name: Build and inspect the only publishable package
        run: npm pack --dry-run --workspace @sevenflanks/omw

      - name: Complete Release PR check
        if: always()
        uses: actions/github-script@v8
        env:
          CHECK_ID: ${{ needs.release-please.outputs.check_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: `Release PR validation ${process.env.JOB_STATUS}`,
                summary: 'Validated on GitHub-hosted Windows with npm ci, release version checks, tests, typecheck, and npm pack --dry-run.',
              },
            })

  publish-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Configure canonical temporary directory
        shell: pwsh
        env:
          RUNNER_TEMP_PATH: ${{ runner.temp }}
        run: |
          # isolation 守衛會拒絕 8.3 alias；不可直接沿用 Windows runner 的預設 TEMP。
          $canonicalTemp = node -p "require('node:fs').realpathSync.native(process.env.RUNNER_TEMP_PATH)"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canonicalTemp)) {
            throw "Failed to resolve runner.temp to a canonical path."
          }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV

      - run: npm install --global npm@11.19.1
      - name: Verify GitHub Release and tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/release/release-registry.mjs resolve "$env:RELEASE_TAG" "$env:RELEASE_SHA"
      - name: Verify repository release versions
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: npm run release:verify -- "$env:RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check whether this version is already published
        id: npm-status
        run: node scripts/release/release-registry.mjs npm-status "$(node -p "require('./packages/launcher/package.json').version")"
      - name: Publish @sevenflanks/omw with npm Trusted Publishing
        if: steps.npm-status.outputs.published != 'true'
        run: npm publish --workspace @sevenflanks/omw

  recover-publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted recovery workflow code from main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Configure canonical temporary directory
        shell: pwsh
        env:
          RUNNER_TEMP_PATH: ${{ runner.temp }}
        run: |
          # isolation 守衛會拒絕 8.3 alias；不可直接沿用 Windows runner 的預設 TEMP。
          $canonicalTemp = node -p "require('node:fs').realpathSync.native(process.env.RUNNER_TEMP_PATH)"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canonicalTemp)) {
            throw "Failed to resolve runner.temp to a canonical path."
          }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV

      - name: Resolve existing GitHub Release to immutable commit
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release/release-registry.mjs resolve "$env:RELEASE_TAG"

      - name: Checkout immutable release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - run: npm install --global npm@11.19.1
      - name: Verify repository release versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run release:verify -- "$env:RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check whether this version is already published
        id: npm-status
        run: node scripts/release/release-registry.mjs npm-status "${{ steps.release.outputs.version }}"
      - name: Republish @sevenflanks/omw with npm Trusted Publishing
        if: steps.npm-status.outputs.published != 'true'
        run: npm publish --workspace @sevenflanks/omw
