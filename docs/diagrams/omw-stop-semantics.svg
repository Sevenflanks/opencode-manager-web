<?xml version="1.0" encoding="UTF-8"?>
<!-- Source: omw-stop-semantics.html; edit the HTML source and re-export rather than editing this generated SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="omw-stop-title omw-stop-desc">
    <title id="omw-stop-title">OMW 三種停止操作</title>
    <desc id="omw-stop-desc">流程圖比較停止 OMW、停止背景執行個體與停止追蹤三種操作，列出每一種真正停止及保留的項目。</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors -->
    <path d="M396 104 V140 Q396 148 388 148 H180 Q172 148 172 156 V184" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="104" x2="480" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M564 104 V140 Q564 148 572 148 H780 Q788 148 788 156 V184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="172" y1="264" x2="172" y2="316" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="264" x2="480" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="788" y1="264" x2="788" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <rect x="300" y="40" width="360" height="64" rx="32" fill="#fff" stroke="#2d3142"/>
    <text x="480" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">現在真正想停止或隱藏什麼？</text>
    <text x="480" y="88" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">三種操作不可互相替代</text>

    <g>
      <rect x="52" y="184" width="240" height="80" rx="6" fill="#eb6c36" fill-opacity=".08" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="68" y="204" fill="#eb6c36" font-size="10" font-family="'Geist Mono',monospace">MANAGER</text>
      <text x="172" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">設定 → 停止 OMW</text>
      <text x="172" y="250" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只關閉管理介面</text>
    </g>
    <g>
      <rect x="360" y="184" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="204" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">INSTANCE</text>
      <text x="480" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">停止背景 Instance</text>
      <text x="480" y="250" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">僅限 OMW-owned process</text>
    </g>
    <g>
      <rect x="668" y="184" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="684" y="204" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">TRACKING</text>
      <text x="788" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">停止追蹤</text>
      <text x="788" y="250" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只從主列表隱藏紀錄</text>
    </g>

    <g>
      <rect x="40" y="316" width="264" height="192" rx="6" fill="#fff" stroke="#eb6c36"/>
      <text x="56" y="340" fill="#eb6c36" font-size="10" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="116" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">Manager、Web、狀態觀察</text>
      <line x1="56" y1="356" x2="288" y2="356" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="56" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="56" y="406" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">所有 Local TUI 與背景 Instance</text>
      <text x="56" y="430" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Sessions、Project files、資料目錄</text>
      <text x="56" y="466" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">再次執行 omw</text>
      <text x="56" y="488" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">即可恢復管理介面</text>
    </g>
    <g>
      <rect x="348" y="316" width="264" height="192" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="364" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="424" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">該背景 Instance 與工作</text>
      <line x1="364" y1="356" x2="596" y2="356" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="364" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="364" y="406" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">OMW Manager 與其他 Instances</text>
      <text x="364" y="430" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">OpenCode Sessions、Project files</text>
      <text x="364" y="466" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Local TUI 永遠不可</text>
      <text x="364" y="488" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">由此操作停止</text>
    </g>
    <g>
      <rect x="656" y="316" width="264" height="192" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="672" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="732" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">主列表中的 tracking 顯示</text>
      <line x1="672" y1="356" x2="904" y2="356" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="672" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="672" y="406" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">process、工作、保留連線埠</text>
      <text x="672" y="430" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Sessions、Project files、Manager</text>
      <text x="672" y="466" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">可由「顯示已停止追蹤」找回</text>
      <text x="672" y="488" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">這不是 Stop process</text>
    </g>

    <line x1="40" y1="548" x2="920" y2="548" stroke="#2d3142" stroke-opacity=".12"/>
    <rect x="40" y="564" width="18" height="12" rx="2" fill="#eb6c36" fill-opacity=".08" stroke="#eb6c36"/>
    <text x="68" y="574" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">MANAGER-ONLY STOP</text>
    <text x="288" y="574" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">ALL THREE KEEP OPENCODE SESSIONS AND PROJECT FILES</text>
  </svg>
