<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMW 三種停止操作</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --rule:rgba(45,49,66,.12); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Noto Sans TC','Microsoft JhengHei',sans-serif; }
    main { max-width:1360px; margin:0 auto; padding:32px 40px 24px; }
    .eyebrow { margin:0 0 4px; color:var(--soft); font:500 8px/1 'Geist Mono',monospace; letter-spacing:.18em; }
    h1 { margin:0; font:400 28px/1.1 'Instrument Serif','Noto Serif TC',serif; }
    .subtitle { margin:8px 0 20px; color:var(--muted); font-size:13px; }
    svg { display:block; width:100%; height:auto; }
    footer { border-top:1px solid var(--rule); margin-top:16px; padding-top:12px; color:var(--soft); font:400 9px/1.5 'Geist Mono',monospace; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">FLOWCHART · DOC-WIDE · MIXED AUDIENCE</p>
  <h1>OMW 三種停止操作</h1>
  <p class="subtitle">先決定想停止的是管理介面、背景 Instance，還是只想從清單隱藏追蹤紀錄。</p>
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="omw-stop-title omw-stop-desc">
    <title id="omw-stop-title">OMW 三種停止操作</title>
    <desc id="omw-stop-desc">流程圖比較停止 OMW、停止執行個體與停止追蹤三種操作，列出每一種真正停止及完整保留的項目。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>

    <!-- Connectors -->
    <line x1="640" y1="104" x2="640" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M520 200 H248 Q240 200 240 208 V300" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="640" y1="260" x2="640" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M760 200 H1032 Q1040 200 1040 208 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="240" y1="380" x2="240" y2="460" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="640" y1="380" x2="640" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="1040" y1="380" x2="1040" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="328" y="176" width="112" height="16" rx="2" fill="#f5f5f5"/>
    <text x="384" y="188" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只關管理介面</text>
    <rect x="652" y="272" width="104" height="16" rx="2" fill="#f5f5f5"/>
    <text x="704" y="284" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">停止背景工作</text>
    <rect x="840" y="176" width="104" height="16" rx="2" fill="#f5f5f5"/>
    <text x="892" y="188" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只隱藏紀錄</text>

    <!-- Nodes -->
    <rect x="500" y="48" width="280" height="56" rx="28" fill="#fff" stroke="#2d3142"/>
    <text x="640" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">現在真正想停止或隱藏什麼？</text>

    <polygon points="640,140 760,200 640,260 520,200" fill="#fff" stroke="#2d3142"/>
    <text x="640" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">選擇操作範圍</text>
    <text x="640" y="216" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">三者不可互相替代</text>

    <g>
      <rect x="120" y="300" width="240" height="80" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="132" y="308" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.55)" stroke-width=".8"/>
      <text x="160" y="317" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">MANAGER</text>
      <text x="240" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">OMW 設定 → 停止 OMW</text>
      <text x="240" y="360" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">確認「只停止 OMW」</text>
    </g>
    <g>
      <rect x="520" y="300" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <rect x="532" y="308" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width=".8"/>
      <text x="564" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">INSTANCE</text>
      <text x="640" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">執行個體操作 → 停止執行個體</text>
      <text x="640" y="360" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只適用 OMW-owned 背景 Instance</text>
    </g>
    <g>
      <rect x="920" y="300" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <rect x="932" y="308" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width=".8"/>
      <text x="964" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle">TRACKING</text>
      <text x="1040" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">執行個體操作 → 停止追蹤</text>
      <text x="1040" y="360" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">可由「顯示已停止追蹤」找回</text>
    </g>

    <g>
      <rect x="96" y="460" width="288" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="460" width="288" height="132" rx="6" fill="#fff" stroke="#eb6c36"/>
      <text x="116" y="486" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="176" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">Manager、Web、狀態觀察</text>
      <line x1="116" y1="500" x2="364" y2="500" stroke="rgba(45,49,66,.12)"/>
      <text x="116" y="522" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="116" y="544" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">所有 Local TUI 與背景 Instance</text>
      <text x="116" y="564" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Sessions、Project files、資料目錄</text>
      <text x="116" y="584" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">再次執行 omw 可恢復管理介面</text>
    </g>
    <g>
      <rect x="496" y="460" width="288" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="460" width="288" height="132" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="516" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="576" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">該背景 Instance 與進行中工作</text>
      <line x1="516" y1="500" x2="764" y2="500" stroke="rgba(45,49,66,.12)"/>
      <text x="516" y="522" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="516" y="544" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">OMW Manager 與其他 Instances</text>
      <text x="516" y="564" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">OpenCode Sessions、Project files</text>
      <text x="516" y="584" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Local TUI 永遠不可由此操作停止</text>
    </g>
    <g>
      <rect x="896" y="460" width="288" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="460" width="288" height="132" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="916" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">STOPS</text>
      <text x="976" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">主列表中的 OMW tracking 顯示</text>
      <line x1="916" y1="500" x2="1164" y2="500" stroke="rgba(45,49,66,.12)"/>
      <text x="916" y="522" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">KEEPS</text>
      <text x="916" y="544" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">process、工作、保留連線埠</text>
      <text x="916" y="564" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">Sessions、Project files、OMW Manager</text>
      <text x="916" y="584" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">這不是 Stop process</text>
    </g>

    <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
    <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">LEGEND</text>
    <rect x="144" y="657" width="18" height="12" rx="2" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="174" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">MANAGER-ONLY STOP</text>
    <rect x="336" y="657" width="18" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
    <text x="366" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">SCOPED ACTION</text>
    <text x="520" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EVERY ACTION PRESERVES OPENCODE SESSIONS AND PROJECT FILES</text>
  </svg>
  <footer>STATIC FLOWCHART · THREE DISTINCT OPERATIONS · CONFIRM IMPACT BEFORE ACTING</footer>
</main>
</body>
</html>
