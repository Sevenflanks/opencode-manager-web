<?xml version="1.0" encoding="UTF-8"?>
<!-- Source: omw-startup-flow.html; edit the HTML source and re-export rather than editing this generated SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="omw-startup-title omw-startup-desc">
    <title id="omw-startup-title">OMW credentials 與啟動結果</title>
    <desc id="omw-startup-desc">流程圖區分有效、缺少與不可讀的 credentials，顯示非互動與取消會結束、不可讀檔不會重設，以及 wrapper fail-open 與 plain 或 required fail-closed 的差異。</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors -->
    <line x1="480" y1="88" x2="480" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="192" x2="480" y2="252" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M340 152 H320 Q312 152 312 160 V272 Q312 280 304 280 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M620 152 H644 Q652 152 652 160 V272 Q652 280 660 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="324" x2="180" y2="368" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M100 304 H56 Q48 304 48 312 V452 Q48 460 56 460 H72 Q80 460 80 468" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="440" x2="180" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M280 404 H320 Q328 404 328 396 V328 Q328 320 336 320 H360" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="348" x2="480" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Branch labels -->
    <rect x="492" y="210" width="36" height="16" rx="2" fill="#f5f5f5"/>
    <text x="510" y="222" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">有效</text>
    <rect x="284" y="132" width="36" height="16" rx="2" fill="#f5f5f5"/>
    <text x="302" y="144" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">缺少</text>
    <rect x="60" y="344" width="52" height="16" rx="2" fill="#f5f5f5"/>
    <text x="86" y="356" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">非互動</text>
    <rect x="192" y="444" width="36" height="16" rx="2" fill="#f5f5f5"/>
    <text x="210" y="456" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">取消</text>

    <!-- Nodes -->
    <rect x="320" y="40" width="320" height="48" rx="24" fill="#fff" stroke="#2d3142"/>
    <text x="480" y="69" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">執行 local package 的 omw</text>

    <polygon points="480,112 620,152 480,192 340,152" fill="#fff" stroke="#2d3142"/>
    <text x="480" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">credentials.dpapi 狀態</text>
    <text x="480" y="168" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">有效／缺少／不可讀</text>

    <polygon points="180,236 300,280 180,324 60,280" fill="#fff" stroke="#2d3142"/>
    <text x="180" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">是互動式終端？</text>
    <text x="180" y="296" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">只有 missing 可設定</text>

    <g>
      <rect x="80" y="368" width="200" height="72" rx="6" fill="#eb6c36" fill-opacity=".08" stroke="#eb6c36"/>
      <text x="96" y="388" fill="#eb6c36" font-size="10" font-family="'Geist Mono',monospace">SETUP</text>
      <text x="180" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">首次設定並安全落盤</text>
      <text x="180" y="430" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">完成後重新讀取驗證</text>
    </g>

    <g>
      <rect x="40" y="468" width="280" height="64" rx="6" fill="#2d3142" fill-opacity=".03" stroke="#2d3142" stroke-opacity=".30"/>
      <text x="180" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">設定需求／取消：回報並結束</text>
      <text x="180" y="516" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">不啟動 Manager，也不啟動 TUI</text>
    </g>

    <g>
      <rect x="360" y="252" width="240" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="272" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">BOOTSTRAP</text>
      <text x="480" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">重用或啟動 OMW Manager</text>
      <text x="480" y="320" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">先驗證 identity，再等待 readiness</text>
      <text x="480" y="338" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">port 衝突或 readiness 失敗則依下方處理</text>
    </g>

    <g>
      <rect x="360" y="388" width="240" height="148" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="408" fill="#eb6c36" font-size="10" font-family="'Geist Mono',monospace">READY</text>
      <text x="376" y="428" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">plain 留背景；wrapper 啟動受管理 TUI</text>
      <line x1="376" y1="440" x2="584" y2="440" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="376" y="458" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">FAIL-OPEN</text>
      <text x="376" y="478" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">僅預設 wrapper：原 argv 啟動原生 TUI</text>
      <text x="376" y="494" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans TC',sans-serif">診斷明示未受 OMW 管理</text>
      <line x1="376" y1="504" x2="584" y2="504" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="376" y="518" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">FAIL-CLOSED</text>
      <text x="480" y="532" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">plain / OMW_REQUIRED=1：錯誤並結束</text>
    </g>

    <g>
      <rect x="660" y="220" width="260" height="176" rx="6" fill="#2d3142" fill-opacity=".03" stroke="#4f5d75"/>
      <text x="676" y="242" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">CORRUPT / UNREADABLE</text>
      <text x="790" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">既有 credentials 不可讀／格式錯誤</text>
      <text x="790" y="286" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">保留原檔，不重設、不輪替 token</text>
      <line x1="676" y1="302" x2="904" y2="302" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="676" y="324" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">WRAPPER</text>
      <text x="744" y="324" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">預設啟動原生 TUI</text>
      <text x="676" y="344" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans TC',sans-serif">診斷明示未受 OMW 管理</text>
      <line x1="676" y1="356" x2="904" y2="356" stroke="#2d3142" stroke-opacity=".12"/>
      <text x="676" y="378" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">PLAIN / REQUIRED</text>
      <text x="790" y="390" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif" text-anchor="middle">回報 credential 錯誤並結束</text>
    </g>

    <line x1="40" y1="548" x2="920" y2="548" stroke="#2d3142" stroke-opacity=".12"/>
    <rect x="40" y="564" width="18" height="12" rx="2" fill="#eb6c36" fill-opacity=".08" stroke="#eb6c36"/>
    <text x="68" y="574" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">MISSING + INTERACTIVE: MAY INITIALIZE</text>
    <text x="440" y="574" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">CORRUPT: NEVER RESET</text>
  </svg>
